name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Rust: lint + test ────────────────────────────────────────────────────────
  rust:
    name: Rust (clippy + tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (pinned)
        # Pinned, not "stable": a new stable can add clippy lints (1.99 flags
        # code generated by #[async_trait]) and break `-D warnings` without any
        # code change. Bump deliberately, together with your local toolchain.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # `cargo test` regenerates the TypeScript types of the API (ts-rs). If a
      # Rust DTO changed but src/api/generated wasn't regenerated and committed,
      # the frontend's types are lying: fail.
      - name: TypeScript bindings are up to date
        shell: bash
        run: |
          git add --intent-to-add ../src/api/generated
          if ! git diff --exit-code -- ../src/api/generated; then
            echo "::error::src/api/generated is stale. Run 'cargo test' in src-tauri and commit the changes."
            exit 1
          fi

  # ── Licenses: GPL-3.0 compatibility + THIRD_PARTY_NOTICES.md ─────────────────
  licenses:
    name: Licenses (cargo-deny + notices)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.96.0 # same pinned toolchain as the rust job

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.0,cargo-about@0.9.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      # Every crate compiled into the app must have a GPL-3.0-compatible
      # license (policy in src-tauri/deny.toml).
      - name: cargo deny check licenses
        working-directory: src-tauri
        run: cargo deny check licenses

      # A dependency was added, removed or bumped without regenerating the notices.
      # The generator runs cargo-about --frozen (offline), so fetch crates first.
      - name: THIRD_PARTY_NOTICES.md is up to date
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          node scripts/third-party-notices.mjs --check

  # ── TypeScript: lint + test ──────────────────────────────────────────────────
  frontend:
    name: Frontend (eslint + vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24 # same major as local dev: npm 10 (Node 20) and npm 11 disagree on optional peers in package-lock.json
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
