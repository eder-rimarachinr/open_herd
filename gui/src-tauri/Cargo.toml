[package]
name = "phpenv-gui"
version = "0.1.1"
description = "Open Herd — Local PHP development environment manager"
authors = []
edition = "2021"

[lib]
name = "phpenv_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false  # lib tests disabled — use integration tests in tests/

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"
which = "6"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking", "stream"] }
zip = "2"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
# Job Object that kills nginx/php-cgi when the app exits (see infrastructure/process_guard.rs).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
axum-test = "15"
tempfile = "3"

[lints.clippy]
# Correctness
unwrap_used = "warn"
expect_used = "warn"
# Style
redundant_closure_for_method_calls = "warn"
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
# Complexity
cognitive_complexity = "warn"
