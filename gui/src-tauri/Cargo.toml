[package]
name = "phpenv-gui"
version = "0.1.0"
description = "PHP Environment Manager"
authors = []
edition = "2021"

[lib]
name = "phpenv_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"
which = "6"
