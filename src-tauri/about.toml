# cargo-about config, read by scripts/third-party-notices.mjs to build
# THIRD_PARTY_NOTICES.md. The license policy (what is allowed) lives in
# deny.toml; keep `accepted` the same list.

# The platforms we ship; crates for other targets are never in a release.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Known crates whose license files cargo-about cannot read on its own.
workarounds = ["ring", "rustls", "chrono", "wasmtime"]

accepted = [
    "GPL-3.0-only",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "bzip2-1.0.6",
]
