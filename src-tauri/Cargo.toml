[package]
name = "open-herd"
version = "0.2.0"
description = "Open Herd — Local PHP development environment manager"
authors = ["Eder R"]
license = "MIT"
repository = "https://github.com/eder-rimarachinr/open_herd"
edition = "2021"

[lib]
name = "open_herd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
which = "8"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "sync", "io-util"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
anyhow = "1"
reqwest = { version = "0.13", features = ["stream"] }
zip = "8"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
# Job Object that kills nginx/php-cgi when the app exits (see infrastructure/process_guard.rs).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
axum-test = "17"
tempfile = "3"

[lints.clippy]
# Correctness
unwrap_used = "warn"
expect_used = "warn"
# Style
redundant_closure_for_method_calls = "warn"
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
# Complexity
cognitive_complexity = "warn"
